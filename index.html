<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watchlist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f3f2ee;
    --card: #ffffff;
    --border: #ebe9e2;
    --text: #17171a;
    --muted: #6b6d76;
    --faint: #a3a5ad;
    --flipkart: #2874f0;
    --flipkart-dk: #185ec7;
    --amazon: #ff9f00;
    --amazon-dk: #cc7f00;
    --myntra: #ff3f6c;
    --myntra-dk: #d92858;
    --shopify: #b6822f;
    --shopify-bg: #fff4de;
    --drop: #14804a;
    --drop-bg: #e7f8ee;
    --rise: #d92d20;
    --rise-bg: #fdecec;
    --stale: #b6822f;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  header {
    position: sticky; top: 0; z-index: 20;
    background: rgba(243,242,238,0.85); backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 14px 16px 12px;
  }
  .header-row { display: flex; align-items: center; justify-content: space-between; max-width: 920px; margin: 0 auto; }
  .brand { display: flex; align-items: center; gap: 9px; }
  .brand-icon {
    width: 32px; height: 32px; border-radius: 10px; flex-shrink: 0;
    background: linear-gradient(135deg, var(--myntra), var(--flipkart));
    display: flex; align-items: center; justify-content: center;
  }
  .brand-icon svg { width: 18px; height: 18px; }
  .brand h1 {
    font-family: 'Space Grotesk', sans-serif; font-size: 1.22rem; font-weight: 700;
    letter-spacing: -0.01em; margin: 0; color: var(--text);
  }
  .live-badge { display: flex; align-items: center; gap: 5px; font-size: 0.72rem; color: var(--muted); font-weight: 600; }
  .live-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--drop); animation: pulse 2s infinite; }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(20,128,74,0.45); }
    70% { box-shadow: 0 0 0 6px rgba(20,128,74,0); }
    100% { box-shadow: 0 0 0 0 rgba(20,128,74,0); }
  }

  .stats { max-width: 920px; margin: 12px auto 0; display: flex; gap: 8px; }
  .stat-pill {
    font-size: 0.76rem; font-weight: 700; padding: 6px 13px; border-radius: 100px;
    background: var(--card); border: 1px solid var(--border); color: var(--muted);
  }
  .stat-pill.hot { background: linear-gradient(135deg, var(--drop), #1da05c); border-color: transparent; color: #fff; }

  .filters {
    max-width: 920px; margin: 11px auto 0; display: flex; gap: 7px;
    overflow-x: auto; scrollbar-width: none; padding-bottom: 2px;
  }
  .filters::-webkit-scrollbar { display: none; }
  .chip {
    flex-shrink: 0; font-size: 0.79rem; font-weight: 700; padding: 8px 15px;
    border-radius: 100px; border: 1.5px solid var(--border); background: var(--card);
    color: var(--muted); cursor: pointer; transition: all 0.25s cubic-bezier(.34,1.4,.64,1);
    white-space: nowrap;
  }
  .chip:active { transform: scale(0.93); }
  .chip.active {
    background: linear-gradient(135deg, var(--myntra), #ff6b8f);
    border-color: transparent; color: #fff;
    box-shadow: 0 4px 14px rgba(255,63,108,0.32);
    transform: scale(1.03);
  }

  main { max-width: 920px; margin: 0 auto; padding: 16px 14px 60px; }

  /* ---------- hero banner (always shown, colorful) ---------- */
  .hero {
    display: block; text-decoration: none; color: inherit;
    border-radius: 20px; padding: 20px; margin-bottom: 16px;
    position: relative; overflow: hidden;
    opacity: 0; animation: rise 0.4s ease forwards;
  }
  .hero.drop { background: linear-gradient(120deg, #0fae5f 0%, #14804a 60%, #0c6b3d 100%); }
  .hero.idle { background: linear-gradient(120deg, var(--flipkart) 0%, #6d3fd9 55%, var(--myntra) 100%); }
  .hero::after {
    content: ''; position: absolute; top: -50%; right: -10%; width: 260px; height: 260px;
    background: radial-gradient(circle, rgba(255,255,255,0.16), transparent 70%);
    pointer-events: none;
  }
  .hero-tag {
    display: inline-flex; align-items: center; gap: 5px; font-size: 0.7rem; font-weight: 800;
    letter-spacing: 0.03em; text-transform: uppercase; color: #fff;
    background: rgba(255,255,255,0.22); padding: 5px 11px; border-radius: 100px; margin-bottom: 13px;
  }
  .hero-body { display: flex; gap: 14px; align-items: center; position: relative; }
  .hero-thumb {
    width: 66px; height: 66px; border-radius: 12px; background: #fff; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; overflow: hidden;
    box-shadow: 0 6px 16px rgba(0,0,0,0.18);
  }
  .hero-thumb img { width: 100%; height: 100%; object-fit: contain; }
  .hero-info { flex: 1; min-width: 0; color: #fff; }
  .hero-name { font-size: 0.9rem; font-weight: 600; margin-bottom: 6px; line-height: 1.3; }
  .hero-price-row { display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap; }
  .hero-price { font-family: 'Space Grotesk', sans-serif; font-size: 1.7rem; font-weight: 700; color: #fff; }
  .hero-was { font-size: 0.82rem; color: rgba(255,255,255,0.65); text-decoration: line-through; }
  .hero-off {
    font-family: 'Space Grotesk', sans-serif; font-size: 0.78rem; font-weight: 800;
    color: #0c6b3d; background: #fff; padding: 3px 10px; border-radius: 7px;
  }
  .hero-idle-text { color: rgba(255,255,255,0.92); font-size: 0.86rem; line-height: 1.5; max-width: 420px; }

  /* ---------- cards ---------- */
  .card {
    display: flex; gap: 12px; padding: 12px; background: var(--card);
    border: 1px solid var(--border); border-radius: 16px; margin-bottom: 10px;
    text-decoration: none; color: inherit; position: relative;
    box-shadow: 0 1px 2px rgba(20,20,30,0.04);
    transition: transform 0.2s cubic-bezier(.34,1.3,.64,1), box-shadow 0.2s ease, border-color 0.2s ease;
    opacity: 0; animation: rise 0.35s ease forwards;
  }
  .card:active { transform: scale(0.98); }
  @media (hover: hover) {
    .card:hover { box-shadow: 0 10px 26px rgba(20,20,30,0.11); transform: translateY(-2px); border-color: #ddd9cc; }
    .card:hover .thumb img { transform: scale(1.07); }
  }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  .thumb {
    width: 74px; height: 74px; flex-shrink: 0; border-radius: 12px; background: #f6f4ee;
    display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative;
  }
  .thumb img { width: 100%; height: 100%; object-fit: contain; transition: transform 0.3s ease; }
  .thumb .ph { color: #c7c4b5; font-size: 1.5rem; }
  .ribbon {
    position: absolute; top: 4px; left: 4px; font-size: 0.62rem; font-weight: 800;
    padding: 2px 6px; border-radius: 5px; background: var(--drop); color: #fff;
  }

  .info { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 6px; }
  .name {
    font-size: 0.86rem; font-weight: 600; line-height: 1.28; color: var(--text);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .price-line { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .price {
    font-family: 'Space Grotesk', sans-serif; font-size: 1.18rem; font-weight: 700;
    font-variant-numeric: tabular-nums; color: var(--text);
  }
  .delta {
    font-size: 0.71rem; font-weight: 800; padding: 3px 9px; border-radius: 100px;
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .delta.down { color: var(--drop); background: var(--drop-bg); }
  .delta.up { color: var(--rise); background: var(--rise-bg); }
  .delta.flat { color: var(--faint); background: #f2f1ec; }
  .spark-inline { flex-shrink: 0; width: 40px; height: 20px; }

  .meta-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .platform-pill {
    display: inline-flex; align-items: center; font-size: 0.65rem; font-weight: 800;
    padding: 3px 8px; border-radius: 6px; color: #fff; letter-spacing: 0.01em;
  }
  .platform-pill.flipkart { background: var(--flipkart); }
  .platform-pill.amazon { background: var(--amazon); color: #2b1900; }
  .platform-pill.myntra { background: var(--myntra); }
  .platform-pill.shopify { background: var(--shopify-bg); color: var(--shopify); }
  .stale-pill {
    font-size: 0.65rem; font-weight: 700; color: var(--stale); background: #fff4de;
    padding: 3px 8px; border-radius: 6px;
  }

  /* ---------- skeleton loading ---------- */
  .skel-card { display: flex; gap: 12px; padding: 12px; background: var(--card); border: 1px solid var(--border); border-radius: 16px; margin-bottom: 10px; }
  .skel-thumb, .skel-line { border-radius: 8px; background: linear-gradient(90deg, #ece9e0 25%, #f7f5ef 37%, #ece9e0 63%); background-size: 400% 100%; animation: shimmer 1.4s ease infinite; }
  .skel-thumb { width: 74px; height: 74px; border-radius: 12px; flex-shrink: 0; }
  .skel-body { flex: 1; display: flex; flex-direction: column; gap: 8px; justify-content: center; }
  .skel-line { height: 12px; }
  .skel-line.w60 { width: 60%; } .skel-line.w40 { width: 40%; } .skel-line.w80 { width: 80%; }
  @keyframes shimmer { 0% { background-position: 100% 0; } 100% { background-position: -100% 0; } }

  .empty {
    max-width: 480px; margin: 60px auto; text-align: center; color: var(--muted);
    font-size: 0.88rem; line-height: 1.7; padding: 0 20px;
  }
  .empty code { background: var(--card); border: 1px solid var(--border); padding: 2px 7px; border-radius: 5px; font-size: 0.82em; color: var(--myntra); }

  #feed { transition: opacity 0.18s ease; }
  #feed.switching { opacity: 0; }

  @media (min-width: 640px) {
    main { padding-top: 22px; }
    .cards-wrap { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 12px; }
    .card { flex-direction: column; margin-bottom: 0; }
    .thumb { width: 100%; height: 150px; border-radius: 12px 12px 0 0; margin: -12px -12px 0; width: calc(100% + 24px); }
    .skel-card { flex-direction: column; }
    .skel-thumb { width: 100%; height: 140px; }
  }
</style>
</head>
<body>

<header>
  <div class="header-row">
    <div class="brand">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="12" r="7.5" stroke="#fff" stroke-width="1.8"/>
          <path d="M12 8V12L14.5 13.8" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <h1>Watchlist</h1>
    </div>
    <div class="live-badge"><span class="live-dot"></span><span id="updated">loading…</span></div>
  </div>
  <div class="stats" id="stats"></div>
  <div class="filters" id="filters">
    <button class="chip active" data-filter="all">All</button>
    <button class="chip" data-filter="drops">🔥 Price drops</button>
    <button class="chip" data-filter="auto">Auto-tracked</button>
    <button class="chip" data-filter="effort">Best-effort</button>
  </div>
</header>

<main>
  <div id="skeleton">
    <div class="skel-card"><div class="skel-thumb"></div><div class="skel-body"><div class="skel-line w80"></div><div class="skel-line w40"></div><div class="skel-line w60"></div></div></div>
    <div class="skel-card"><div class="skel-thumb"></div><div class="skel-body"><div class="skel-line w80"></div><div class="skel-line w40"></div><div class="skel-line w60"></div></div></div>
    <div class="skel-card"><div class="skel-thumb"></div><div class="skel-body"><div class="skel-line w80"></div><div class="skel-line w40"></div><div class="skel-line w60"></div></div></div>
  </div>
  <div id="empty" class="empty" style="display:none">
    No price data yet. Run <code>python scraper.py</code> once (or wait for the
    first scheduled Action run) to populate this page.
  </div>
  <div id="hero-wrap"></div>
  <div id="feed" class="cards-wrap"></div>
</main>

<script>
const BEST_EFFORT = new Set(['flipkart', 'myntra', 'amazon']);
let ROWS = [];

function sparkline(readings, color) {
  if (!readings || readings.length < 2) return '';
  const prices = readings.map(r => r.price);
  const min = Math.min(...prices), max = Math.max(...prices);
  const range = max - min || 1;
  const pts = prices.map((p, i) => {
    const x = (i / (prices.length - 1)) * 36 + 2;
    const y = 17 - ((p - min) / range) * 13 - 2;
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
  return `<svg class="spark-inline" viewBox="0 0 40 20"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

function platformLabel(p) {
  return { shopify: 'Official', flipkart: 'Flipkart', amazon: 'Amazon', myntra: 'Myntra' }[p] || p;
}

function renderHero() {
  const heroWrap = document.getElementById('hero-wrap');
  const drops = ROWS.filter(r => r.diff < 0 && r.readings.length > 1);
  if (drops.length) {
    const best = drops[0];
    const { item, current, pct, readings } = best;
    const was = readings[0].price;
    const img = item.image ? `<img src="${item.image}" alt="">` : `<span class="ph">⌚</span>`;
    heroWrap.innerHTML = `
      <a class="hero drop" href="${item.url}" target="_blank" rel="noopener">
        <span class="hero-tag">🔥 Biggest drop right now</span>
        <div class="hero-body">
          <div class="hero-thumb">${img}</div>
          <div class="hero-info">
            <div class="hero-name">${item.name}</div>
            <div class="hero-price-row">
              <span class="hero-price">₹${current.toLocaleString('en-IN')}</span>
              <span class="hero-was">₹${was.toLocaleString('en-IN')}</span>
              <span class="hero-off">${Math.abs(pct).toFixed(0)}% off</span>
            </div>
          </div>
        </div>
      </a>`;
  } else {
    const dropCount = ROWS.filter(r => r.diff < 0).length;
    heroWrap.innerHTML = `
      <div class="hero idle">
        <span class="hero-tag">📡 Tracking live</span>
        <div class="hero-idle-text"><b>${ROWS.length} items</b> being checked daily across Timex, Casio, Flipkart, Amazon and Myntra. Price-drop highlights will show up here as soon as there's real movement to report.</div>
      </div>`;
  }
}

function render(filter) {
  const feed = document.getElementById('feed');
  let rows = ROWS;
  if (filter === 'drops') rows = rows.filter(r => r.diff < 0);
  if (filter === 'auto') rows = rows.filter(r => !r.isBestEffort);
  if (filter === 'effort') rows = rows.filter(r => r.isBestEffort);

  if (!rows.length) {
    feed.innerHTML = `<div class="empty">Nothing matches this filter yet.</div>`;
    return;
  }

  feed.innerHTML = rows.map((r, i) => {
    const { item, current, diff, pct, isBestEffort, status, readings } = r;
    const priceStr = current != null ? `₹${current.toLocaleString('en-IN')}` : '—';
    let deltaClass = 'flat', deltaStr = readings.length > 1 ? 'no change' : 'day 1';
    let trendColor = '#a3a5ad';
    if (diff < 0) { deltaClass = 'down'; deltaStr = `▼ ${Math.abs(pct).toFixed(1)}%`; trendColor = '#14804a'; }
    else if (diff > 0) { deltaClass = 'up'; deltaStr = `▲ ${pct.toFixed(1)}%`; trendColor = '#d92d20'; }

    const img = item.image ? `<img src="${item.image}" alt="" loading="lazy">` : `<span class="ph">⌚</span>`;
    const ribbon = diff < 0 ? `<span class="ribbon">-${Math.abs(pct).toFixed(0)}%</span>` : '';
    const stalePill = status === 'failed' ? `<span class="stale-pill">stale</span>` : '';
    const spark = sparkline(readings, trendColor);

    return `
      <a class="card" href="${item.url}" target="_blank" rel="noopener" style="animation-delay:${Math.min(i,10)*30}ms">
        <div class="thumb">${img}${ribbon}</div>
        <div class="info">
          <div class="name">${item.name}</div>
          <div class="price-line">
            <span class="price">${priceStr}</span>
            <span class="delta ${deltaClass}">${deltaStr}</span>
            ${spark}
          </div>
          <div class="meta-row">
            <span class="platform-pill ${item.platform}">${platformLabel(item.platform)}</span>
            ${stalePill}
          </div>
        </div>
      </a>`;
  }).join('');
}

async function load() {
  let history;
  try {
    const res = await fetch('data/history.json?_=' + Date.now());
    history = await res.json();
  } catch (e) {
    document.getElementById('skeleton').style.display = 'none';
    document.getElementById('empty').style.display = 'block';
    document.getElementById('updated').textContent = 'no data yet';
    return;
  }

  const entries = Object.values(history);
  document.getElementById('skeleton').style.display = 'none';
  if (!entries.length) {
    document.getElementById('empty').style.display = 'block';
    return;
  }

  let latestDate = null;
  ROWS = entries.map(item => {
    const readings = item.readings || [];
    const last = readings[readings.length - 1];
    const first = readings[0];
    if (last && (!latestDate || last.date > latestDate)) latestDate = last.date;

    const current = last ? last.price : null;
    const baseline = first ? first.price : current;
    const diff = current != null && baseline != null ? current - baseline : 0;
    const pct = baseline ? (diff / baseline) * 100 : 0;

    return { item, current, diff, pct, readings, isBestEffort: BEST_EFFORT.has(item.platform), status: item.last_status };
  });

  ROWS.sort((a, b) => a.pct - b.pct);

  document.getElementById('updated').textContent = latestDate ? `updated ${latestDate}` : '';
  const dropCount = ROWS.filter(r => r.diff < 0).length;
  document.getElementById('stats').innerHTML =
    `<span class="stat-pill">${ROWS.length} tracked</span>` +
    (dropCount ? `<span class="stat-pill hot">🔥 ${dropCount} price drop${dropCount > 1 ? 's' : ''}</span>` : '');

  renderHero();
  render('all');
}

document.getElementById('filters').addEventListener('click', (e) => {
  const btn = e.target.closest('.chip');
  if (!btn) return;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  btn.classList.add('active');
  const feed = document.getElementById('feed');
  feed.classList.add('switching');
  setTimeout(() => { render(btn.dataset.filter); feed.classList.remove('switching'); }, 140);
});

load();
</script>

</body>
</html>
