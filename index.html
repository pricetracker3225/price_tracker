<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watchlist — Price Tracker</title>
<style>
  :root {
    --bg: #15161a;
    --panel: #1c1e24;
    --panel-border: #2a2d35;
    --text: #e8e6df;
    --muted: #8b8d97;
    --brass: #c9a15c;
    --up: #d9705c;
    --down: #6fae7f;
    --stale: #7a6b3e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
    padding: 40px 20px 80px;
  }
  header {
    max-width: 1100px;
    margin: 0 auto 36px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 10px;
    border-bottom: 1px solid var(--panel-border);
    padding-bottom: 20px;
  }
  header h1 {
    font-size: 1.5rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    margin: 0;
    color: var(--brass);
  }
  header .sub {
    font-size: 0.85rem;
    color: var(--muted);
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }
  .grid {
    max-width: 1100px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 16px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition: border-color 0.15s ease;
  }
  .card:hover { border-color: #3a3d47; }
  .card a { color: inherit; text-decoration: none; }
  .thumb {
    width: 100%;
    aspect-ratio: 1 / 1;
    background: #0f1013;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .thumb img { width: 100%; height: 100%; object-fit: contain; }
  .thumb .placeholder { color: var(--muted); font-size: 0.75rem; }
  .body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 8px; }
  .name {
    font-size: 0.9rem;
    line-height: 1.3;
    min-height: 2.4em;
  }
  .price-row {
    display: flex;
    align-items: baseline;
    gap: 10px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }
  .price {
    font-size: 1.4rem;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .delta {
    font-size: 0.78rem;
    padding: 2px 7px;
    border-radius: 20px;
    font-weight: 600;
  }
  .delta.down { color: var(--down); background: rgba(111,174,127,0.12); }
  .delta.up { color: var(--up); background: rgba(217,112,92,0.12); }
  .delta.flat { color: var(--muted); background: rgba(139,141,151,0.1); }
  .meta {
    font-size: 0.72rem;
    color: var(--muted);
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    display: flex;
    justify-content: space-between;
    margin-top: 4px;
  }
  .tag { padding: 1px 6px; border-radius: 4px; border: 1px solid var(--panel-border); }
  .tag.stale { color: var(--stale); border-color: var(--stale); }
  .empty {
    max-width: 1100px;
    margin: 60px auto;
    text-align: center;
    color: var(--muted);
    font-size: 0.9rem;
    line-height: 1.6;
  }
</style>
</head>
<body>

<header>
  <h1>⌚ Watchlist</h1>
  <div class="sub" id="updated">loading…</div>
</header>

<div id="grid" class="grid"></div>
<div id="empty" class="empty" style="display:none">
  No price data yet. Run <code>python scraper.py</code> once (or wait for the
  first scheduled Action run) to populate this page.
</div>

<script>
async function load() {
  let history;
  try {
    const res = await fetch('data/history.json?_=' + Date.now());
    history = await res.json();
  } catch (e) {
    document.getElementById('empty').style.display = 'block';
    document.getElementById('updated').textContent = 'no data yet';
    return;
  }

  const entries = Object.values(history);
  if (!entries.length) {
    document.getElementById('empty').style.display = 'block';
    return;
  }

  const bestEffort = new Set(['flipkart', 'myntra', 'amazon']);
  const grid = document.getElementById('grid');
  let latestDate = null;

  const rows = entries.map(item => {
    const readings = item.readings || [];
    const last = readings[readings.length - 1];
    const first = readings[0];
    if (last && (!latestDate || last.date > latestDate)) latestDate = last.date;

    const current = last ? last.price : null;
    const baseline = first ? first.price : current;
    const diff = current != null && baseline != null ? current - baseline : 0;
    const pct = baseline ? (diff / baseline) * 100 : 0;

    return { item, current, diff, pct, isBestEffort: bestEffort.has(item.platform), status: item.last_status };
  });

  // Show biggest price drops first — that's the actually useful ordering
  rows.sort((a, b) => a.pct - b.pct);

  document.getElementById('updated').textContent =
    latestDate ? `last checked: ${latestDate}` : '';

  grid.innerHTML = rows.map(r => {
    const { item, current, diff, pct, isBestEffort, status } = r;
    const priceStr = current != null ? `₹${current.toLocaleString('en-IN')}` : '—';
    let deltaClass = 'flat', deltaStr = 'first reading';
    if (diff < 0) { deltaClass = 'down'; deltaStr = `▼ ₹${Math.abs(diff).toLocaleString('en-IN')} (${pct.toFixed(1)}%)`; }
    else if (diff > 0) { deltaClass = 'up'; deltaStr = `▲ ₹${diff.toLocaleString('en-IN')} (+${pct.toFixed(1)}%)`; }

    const img = item.image
      ? `<img src="${item.image}" alt="">`
      : `<span class="placeholder">no photo yet</span>`;

    const staleTag = status === 'failed'
      ? `<span class="tag stale">stale</span>`
      : (isBestEffort ? `<span class="tag">best-effort</span>` : `<span class="tag">auto</span>`);

    return `
      <div class="card">
        <a href="${item.url}" target="_blank" rel="noopener">
          <div class="thumb">${img}</div>
          <div class="body">
            <div class="name">${item.name}</div>
            <div class="price-row">
              <span class="price">${priceStr}</span>
              <span class="delta ${deltaClass}">${deltaStr}</span>
            </div>
            <div class="meta">
              <span>${item.platform}</span>
              ${staleTag}
            </div>
          </div>
        </a>
      </div>`;
  }).join('');
}

load();
</script>

</body>
</html>
